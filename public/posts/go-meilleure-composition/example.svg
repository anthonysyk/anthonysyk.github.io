<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, sans-serif" font-size="14">
  <style>
    text{fill:#f2f2f4}
    .s{font-size:12px;fill:#a8a9b2}
  </style>
  <rect width="760" height="250" rx="14" fill="#1c1c1e"/>
  <text x="20" y="28" font-weight="600">Cap de coût 25 : la meilleure lineup n'est pas celle des meilleurs joueurs</text>
  <rect x="20" y="50" width="350" height="80" rx="8" fill="#4a2a2a" stroke="#b15b5b"/>
  <text x="34" y="78">G1 + D1 + F1</text>
  <text class="s" x="34" y="100">210 points, coût 36</text>
  <text class="s" x="34" y="118">trop cher : refusée (cap dépassé)</text>
  <rect x="390" y="50" width="350" height="80" rx="8" fill="#3d7a4f" stroke="#6fbf8a"/>
  <text x="404" y="78">G2 + D2 + F2</text>
  <text class="s" x="404" y="100">183 points, coût 23</text>
  <text class="s" x="404" y="118">la meilleure lineup valide</text>
  <rect x="20" y="150" width="720" height="70" rx="8" fill="#30446b" stroke="#5b7db1"/>
  <text x="34" y="178">Lineup strength d'une lineup à 150 points = 150 / 183 = 82 %</text>
  <text class="s" x="34" y="200">27 combinaisons possibles, 17 respectent le cap</text>
</svg>
